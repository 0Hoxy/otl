<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객실 수정</title>
    <!-- 부트스트랩 CSS 포함 -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- 커스텀 CSS -->
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .form-group label {
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            border-radius: 4px;
        }
        .form-row {
            margin-bottom: 15px;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border: none;
        }
        .btn-secondary {
            background-color: #6c757d;
            border: none;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
            border: none;
        }
        .image-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .image-item span {
            margin-right: 10px;
        }
        #file-error-message {
            color: red;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="my-4 text-center">객실 수정</h1>
    <form th:action="@{/accommodation/business/room/update/{id}(id=${room.roomId})}" th:object="${room}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="roomName">객실명</label>
            <input type="text" class="form-control" id="roomName" name="roomName" th:field="*{roomName}" maxlength="100" placeholder="객실명을 입력하세요" required>
        </div>
        <div class="form-group">
            <label for="roomDescription">객실 설명</label>
            <textarea class="form-control" id="roomDescription" name="roomDescription" th:field="*{roomDescription}" rows="3" maxlength="200" placeholder="객실 설명을 입력하세요" required></textarea>
        </div>
        <div class="form-group">
            <label for="roomPrice">객실 가격</label>
            <input type="number" class="form-control" id="roomPrice" name="roomPrice" th:field="*{roomPrice}" placeholder="객실 가격을 입력하세요" required>
        </div>
        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="checkIn">체크인 시간</label>
                <input type="time" class="form-control" id="checkIn" name="checkIn" th:field="*{checkIn}" required>
            </div>
            <div class="form-group col-md-6">
                <label for="checkOut">체크아웃 시간</label>
                <input type="time" class="form-control" id="checkOut" name="checkOut" th:field="*{checkOut}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="roomMinCnt">최소 수용 인원</label>
                <input type="number" class="form-control" id="roomMinCnt" name="roomMinCnt" th:field="*{roomMinCnt}" placeholder="최소 수용 인원 수" required>
                <small id="minCountError" class="form-text text-danger" style="display: none;">최소 수용 인원은 1명 이상이어야 합니다.</small>
            </div>
            <div class="form-group col-md-6">
                <label for="roomMaxCnt">최대 수용 인원</label>
                <input type="number" class="form-control" id="roomMaxCnt" name="roomMaxCnt" th:field="*{roomMaxCnt}" placeholder="최대 수용 인원 수" required>
                <small id="maxCountError" class="form-text text-danger" style="display: none;">최대 수용 인원은 최소 수용 인원보다 많아야 합니다.</small>
            </div>
        </div>

        <div class="form-group" id="existing-images-container">
            <label>기존 이미지</label>
            <div id="image-container">
                <div class="image-item" th:each="img : ${roomImgs}" th:id="'image-item-' + ${img.roomImgId}" th:data-img-id="${img.roomImgId}">
                    <span th:text="${img.roomImgName}"></span>
                    <button type="button" class="btn btn-danger btn-sm delete-img-btn">삭제</button>
                </div>
            </div>
        </div>

        <!-- 새로운 이미지 추가 -->
        <div class="form-group">
            <label>새로운 이미지 추가 (최대 4개)</label>
            <br>
            <input type="file" id="new-images" name="roomImgs" multiple accept="image/*"/>
            <br/>
            <small id="file-error-message"></small>
        </div>

        <button type="submit" class="btn btn-primary btn-block">수정</button>
    </form>
    <a th:href="@{/accommodation/business/roomlist(id=${room.accommodation.accommodationId})}" class="btn btn-secondary btn-block mt-3">뒤로가기</a>
</div>
</body>

<script>
    // 최대 파일 입력 개수 설정
    const MAX_IMAGE_INPUTS = 4;
    const fileInput = document.getElementById('new-images');
    const fileErrorMessage = document.getElementById('file-error-message');

    fileInput.addEventListener('change', function(event) {
        const files = event.target.files;
        if (files.length > MAX_IMAGE_INPUTS) {
            fileErrorMessage.textContent = `최대 ${MAX_IMAGE_INPUTS}개의 이미지만 업로드할 수 있습니다.`;
            event.target.value = ''; // 파일 선택 초기화
        } else {
            fileErrorMessage.textContent = '';
        }
    });

    document.addEventListener("DOMContentLoaded", function() {
        const minCountInput = document.getElementById("roomMinCnt");
        const maxCountInput = document.getElementById("roomMaxCnt");
        const minCountError = document.getElementById("minCountError");
        const maxCountError = document.getElementById("maxCountError");
        const form = document.querySelector("form");

        function validateCounts() {
            const minCount = parseInt(minCountInput.value, 10) || 0;
            const maxCount = parseInt(maxCountInput.value, 10) || 0;
            let isValid = true;

            if (minCount < 1) {
                minCountError.style.display = "block";
                isValid = false;
            } else {
                minCountError.style.display = "none";
            }

            if (maxCount <= minCount) {
                maxCountError.style.display = "block";
                isValid = false;
            } else {
                maxCountError.style.display = "none";
            }

            form.querySelector("button[type='submit']").disabled = !isValid;
        }

        minCountInput.addEventListener("input", validateCounts);
        maxCountInput.addEventListener("input", validateCounts);
    });
</script>

</html>
