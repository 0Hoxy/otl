<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객실 추가</title>
    <!-- 부트스트랩 CSS 포함 -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- 커스텀 CSS -->
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .form-group label {
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            border-radius: 4px;
        }
        .form-row {
            margin-bottom: 15px;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border: none;
        }
        .btn-secondary {
            background-color: #6c757d;
            border: none;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
            border: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="my-4 text-center">객실 추가</h1>
    <form th:action="@{/accommodation/business/room/create/{accommodationId}(accommodationId=${accommodationId})}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="roomName">객실명</label>
            <input type="text" class="form-control" id="roomName" name="roomName" placeholder="객실명을 입력하세요" required>
        </div>
        <div class="form-group">
            <label for="roomDescription">객실 설명</label>
            <textarea class="form-control" id="roomDescription" name="roomDescription" rows="3" placeholder="객실 설명을 입력하세요" required></textarea>
        </div>
        <div class="form-group">
            <label for="roomPrice">객실 가격</label>
            <input type="number" class="form-control" id="roomPrice" name="roomPrice" placeholder="객실 가격을 입력하세요" required>
        </div>
        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="checkIn">체크인 시간</label>
                <input type="time" class="form-control" id="checkIn" name="checkIn" required>
            </div>
            <div class="form-group col-md-6">
                <label for="checkOut">체크아웃 시간</label>
                <input type="time" class="form-control" id="checkOut" name="checkOut" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="roomMinCnt">최소 수용 인원</label>
                <input type="number" class="form-control" id="roomMinCnt" name="roomMinCnt" placeholder="최소 수용 인원 수" required>
            </div>
            <div class="form-group col-md-6">
                <label for="roomMaxCnt">최대 수용 인원</label>
                <input type="number" class="form-control" id="roomMaxCnt" name="roomMaxCnt" placeholder="최대 수용 인원 수" required>
            </div>
        </div>
        <div id="image-inputs" class="form-group">
            <label for="roomImg1">객실 이미지</label>
            <br>
            <input type="file" id="roomImg1" name="roomImgs" accept="image/*" required>
        </div>
        <input type="hidden" name="accommodationId" th:value="accommodationId"> <!-- 외래키, 실제 값으로 대체 필요 -->
        <button type="submit" class="btn btn-primary btn-block">추가</button>
    </form>
    <a th:href="@{/accommodation/business/roomlist(id=${accommodationId})}" class="btn btn-secondary btn-block mt-3">뒤로가기</a>
</div>
</body>

<script>
    // 최대 입력란 개수 설정
    const MAX_IMAGE_INPUTS = 4;

    // 이미지 입력란 추가 함수
    function addImageInput(event) {
        // 이벤트가 없으면 exit
        if (!event || !event.target || !event.target.files.length) {
            return;
        }

        var container = document.getElementById("image-inputs");
        var inputCount = container.getElementsByTagName("input").length;

        // 현재 입력란 개수가 최대 개수보다 적으면 새 입력란 추가
        if (inputCount < MAX_IMAGE_INPUTS) {
            var newInput = document.createElement("input");
            newInput.setAttribute("type", "file");
            newInput.setAttribute("name", "roomImgs");
            newInput.setAttribute("accept", "image/*"); // 이미지 파일만 허용
            newInput.addEventListener("change", addImageInput); // 파일이 선택되면 다음 입력란 추가
            container.appendChild(newInput);
        }
    }

    // 페이지가 로드된 후 초기 입력란에 이벤트 추가
    document.addEventListener("DOMContentLoaded", function() {
        var initialInput = document.getElementById("roomImg1");
        initialInput.addEventListener("change", addImageInput);
    });
</script>

</html>
