<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숙소 목록</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .property-item {
            display: flex;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
            background-color: #fff;
        }
        .property-item:hover {
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
        }
        .property-img {
            flex: 0 0 200px;
            max-height: 150px;
            overflow: hidden;
        }
        .property-img img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }
        .property-info {
            flex: 1;
            padding: 15px;
        }
        .property-info h5 {
            margin-top: 0;
        }
        .btn-custom {
            margin: 0 5px;
        }
        .pagination {
            justify-content: center;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">사업자 숙소 관리 페이지</h1>
    <div class="mb-4">
        <a href="http://localhost:8080/accommodation/list" class="btn btn-primary btn-sm btn-custom">뒤로가기</a>
        <a href="http://localhost:8080/accommodation/business/create" class="btn btn-primary btn-sm btn-custom">숙소 등록</a>
    </div>

    <div class="list-group">
        <div th:each="accommodation : ${accommodations.content}" class="property-item">
            <!-- 이미지 Carousel 시작 -->
            <div th:id="'carousel-' + ${accommodation.accommodationId}" class="carousel slide property-img" data-ride="carousel">
                <div class="carousel-inner">
                    <div th:each="img, iterStat : ${accommodation.accommodationImgs}"
                         class="carousel-item" th:classappend="${iterStat.index == 0} ? 'active' : ''">
                        <img th:src="@{${img.accommodationImgPath}}" class="d-block w-100" alt="Accommodation Image">
                    </div>
                </div>
                <a class="carousel-control-prev" th:href="'#carousel-' + ${accommodation.accommodationId}" role="button" data-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="sr-only">Previous</span>
                </a>
                <a class="carousel-control-next" th:href="'#carousel-' + ${accommodation.accommodationId}" role="button" data-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="sr-only">Next</span>
                </a>
            </div>
            <!-- 이미지 Carousel 끝 -->

            <div class="property-info">
                <h5>
                    <a th:href="@{/accommodation/detail/{id}(id=${accommodation.accommodationId})}" th:text="${accommodation.accommodationName}" class="text-decoration-none">숙소 이름</a>
                </h5>
                <p class="mb-2" th:text="${accommodation.accommodationAddress}">숙소 주소</p>
                <a th:href="@{/accommodation/business/roomlist(id=${accommodation.accommodationId})}" class="btn btn-primary btn-sm btn-custom">객실 관리</a>
                <a th:href="@{/accommodation/business/update/{id}(id=${accommodation.accommodationId})}" class="btn btn-warning btn-sm btn-custom">수정</a>
                <form th:action="@{/accommodation/business/delete/{id}(id=${accommodation.accommodationId})}" method="post" style="display:inline;">
                    <input type="hidden" name="_method" value="delete">
                    <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 페이지 네비게이션 시작 -->
    <nav>
        <ul class="pagination">
            <!-- 이전 페이지 버튼 -->
            <li class="page-item" th:classappend="${accommodations.hasPrevious()} ? '' : 'disabled'">
                <a class="page-link" th:href="@{/accommodation/business/list(page=${accommodations.number - 1})}" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <!-- 페이지 번호 버튼들 -->
            <li class="page-item" th:each="i : ${#numbers.sequence(1, accommodations.totalPages)}"
                th:classappend="${i == accommodations.number + 1} ? 'active' : ''">
                <a class="page-link" th:href="@{/accommodation/business/list(page=${i - 1})}" th:text="${i}">1</a>
            </li>

            <!-- 다음 페이지 버튼 -->
            <li class="page-item" th:classappend="${accommodations.hasNext()} ? '' : 'disabled'">
                <a class="page-link" th:href="@{/accommodation/business/list(page=${accommodations.number + 1})}" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>
    <!-- 페이지 네비게이션 끝 -->
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
