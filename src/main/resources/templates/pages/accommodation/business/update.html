<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숙소 수정 페이지</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .registration-form {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .form-group label {
            font-weight: bold;
        }
        .hidden {
            display: none;
        }
        .error-message {
            color: red;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="registration-form">
        <h2 class="text-center">숙소 수정</h2>
        <form th:action="@{/accommodation/business/update/{id}(id=${accommodation.accommodationId})}" th:object="${accommodation}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="themeName">업소 구분</label>
                <select class="form-control" id="themeName" name="themeName" th:field="*{themeName}">
                    <option value="호텔">호텔</option>
                    <option value="펜션">펜션</option>
                    <option value="모텔">모텔</option>
                    <option value="리조트">리조트</option>
                </select>
            </div>

            <div class="form-group">
                <label for="accommodationName">숙소명</label>
                <input type="text" class="form-control" id="accommodationName" name="accommodationName" th:field="*{accommodationName}" placeholder="숙소명을 입력하세요">
            </div>
            <div class="form-group">
                <label for="accommodationAddress">숙소 주소</label>
                <input type="text" class="form-control" id="accommodationAddress" name="accommodationAddress" th:field="*{accommodationAddress}" placeholder="숙소 주소를 입력하세요">
            </div>
            <div class="form-group">
                <label for="accommodationDescription">숙소 설명</label>
                <textarea class="form-control" id="accommodationDescription" name="accommodationDescription" rows="3" th:field="*{accommodationDescription}" placeholder="숙소 설명을 입력하세요"></textarea>
            </div>

            <div class="form-group" id="existing-images-container">
                <label>기존 이미지</label>
                <div id="image-container">
                    <div class="image-item" th:each="img : ${accommodationImgs}" th:id="'image-item-' + ${img.accommodationImgId}" th:data-img-id="${img.accommodationImgId}">
                        <span th:text="${img.accommodationImgName}"></span>
                        <button type="button" class="btn btn-danger btn-sm delete-img-btn">삭제</button>
                    </div>
                </div>
            </div>

            <!-- 새로운 이미지 추가 -->
            <div class="form-group">
                <label>새로운 이미지 추가 (최대 4개)</label>
                <br>
                <input type="file" id="new-images" name="accommodationImgs" multiple accept="image/*"/><br/>
                <small class="error-message" id="file-error-message"></small>
            </div>
            <button type="submit" class="btn btn-primary btn-block">수정</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const imageContainer = document.getElementById('image-container');
        const fileInput = document.getElementById('new-images');
        const errorMessage = document.getElementById('file-error-message');
        const existingImagesContainer = document.getElementById('existing-images-container');

        // 이미지 삭제 버튼 클릭 이벤트
        imageContainer.addEventListener('click', function(event) {
            if (event.target.classList.contains('delete-img-btn')) {
                const imageItem = event.target.closest('.image-item');
                const imgId = imageItem.getAttribute('data-img-id');

                // 기존에 같은 이미지 ID를 가진 hidden input이 있는지 확인하고, 있다면 제거
                const existingHiddenInputs = document.querySelectorAll(`input[name="deleteImgIds"][value="${imgId}"]`);
                existingHiddenInputs.forEach(input => input.remove());

                // 새로운 hidden input 생성하여 폼에 추가
                const hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.name = 'deleteImgIds';
                hiddenInput.value = imgId;

                // 폼에 hidden input 추가
                document.querySelector('form').appendChild(hiddenInput);

                // 삭제된 이미지 항목을 화면에서 제거
                imageItem.remove();

                // 모든 이미지가 삭제되면 컨테이너 숨기기
                if (imageContainer.children.length === 0) {
                    existingImagesContainer.style.display = 'none';
                }
            }
        });

        // 파일 입력 변경 이벤트
        fileInput.addEventListener('change', function(event) {
            const existingImagesCount = document.querySelectorAll('#image-container .image-item').length;
            const selectedFilesCount = event.target.files.length;
            const maxImages = 4;
            const totalCount = existingImagesCount + selectedFilesCount;

            if (totalCount > maxImages) {
                errorMessage.textContent = `최대 ${maxImages}개의 이미지만 업로드할 수 있습니다. 현재 ${existingImagesCount}개가 등록되어 있습니다.`;
                fileInput.value = ''; // 선택된 파일을 비워줍니다.
            } else {
                errorMessage.textContent = '';
            }
        });

        // 페이지 로드 시 기존 이미지가 없으면 컨테이너 숨기기
        if (document.querySelectorAll('#image-container .image-item').length === 0) {
            existingImagesContainer.style.display = 'none';
        }
    });
</script>

</body>
</html>
